<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[TNT] - Quy hoạch</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  /* cửa sổ Modul 6 chiếm trọn khung (không kéo/thu nhỏ như trên Tampermonkey) */
  #ghn-tuyen-giao-root { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important;
    border-radius: 0 !important; box-shadow: none !important; min-width: 0 !important; min-height: 0 !important; }
  #ghn-tuyen-giao-titlebar, #ghn-tg-resize-handle, #ghn-tuyen-giao-launcher-btn,
  #ghn-tg-admin-open-btn, .ghn-tg-tab-btn[data-tab="sync"], #ghn-tg-panel-sync { display: none !important; }
  .qh-lab { font-size: 12px; color: #495057; display: inline-flex; align-items: center; gap: 4px; }
  .qh-lab select { max-width: 220px; font-weight: 600; }
  .qh-clear { padding: 4px 8px; border-radius: 6px; border: 1px solid #ced4da; background: #fff; color: #868e96; cursor: pointer; font-size: 12px; }
  .qh-clear:hover { color: #c92a2a; border-color: #c92a2a; }
  table.qh-sum { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.qh-sum th { position: sticky; top: 0; background: #f1f3f5; text-align: left; padding: 5px 6px; border-bottom: 1px solid #dee2e6; }
  table.qh-sum td { padding: 4px 6px; border-bottom: 1px solid #f1f3f5; }
  table.qh-sum td:nth-child(n+2), table.qh-sum th:nth-child(n+2) { text-align: right; }
  .qh-ghn-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px; background:#fff8e6; border-bottom:1px solid #f1dfb0; font-size:12px; }
  .qh-ghn-ok { color:#2b8a3e; font-weight:700; } .qh-ghn-no { color:#c92a2a; font-weight:700; }
  .qh-ghn-btn { padding:6px 12px; border-radius:6px; border:none; background:#ff7300; color:#fff; font-weight:700; cursor:pointer; }
  .qh-ghn-btn2 { padding:4px 10px; border-radius:6px; border:1px solid #ced4da; background:#fff; color:#495057; cursor:pointer; }
  .qh-ghn-help { color:#5c5f66; }
  .qh-bm { display:inline-block; padding:2px 8px; border-radius:5px; background:#1c7ed6; color:#fff !important; font-weight:700; text-decoration:none; cursor:grab; }
  .qh-bc-link { color: #1c7ed6; text-decoration: underline; }
  /* ===== 16/11 — GỌN GIAO DIỆN, TĂNG DIỆN TÍCH BẢN ĐỒ (chỉ bản web) ===== */
  #ghn-tuyen-giao-tabs { padding: 3px 8px 0 !important; gap: 2px !important; }
  .ghn-tg-tab-btn { padding: 4px 12px !important; font-size: 12px !important; }
  #ghn-tg-map-controls { flex-wrap: nowrap !important; overflow-x: auto; overflow-y: hidden; padding: 4px 8px !important; gap: 6px !important; scrollbar-width: thin; }
  #ghn-tg-map-controls > label, #ghn-tg-map-controls .qh-lab { font-size: 0 !important; gap: 0 !important; flex-shrink: 0; }
  #ghn-tg-map-controls select { font-size: 12px !important; padding: 4px 6px !important; }
  #ghn-tg-map-controls > label:has(#ghn-tg-region-select) { font-size: 12px !important; gap: 4px !important; font-weight: 600; color: #495057; }
  #ghn-tg-region-select { width: 80px; }
  .qh-ms input { width: 150px !important; border: 0 !important; box-shadow: none !important; background: none !important; height: 26px !important; padding: 0 6px !important; margin: 0 !important; } #qh-am input { width: 190px !important; } #ghn-tg-mode-select { width: 100px; }
  #ghn-tg-map-controls .qh-search { width: 135px; flex-shrink: 0; }
  #ghn-tg-map-controls .ghn-tg-combo-trigger { min-width: 0 !important; padding: 4px 8px !important; }
  #ghn-tg-map-controls button, #ghn-tg-map-controls .ghn-tg-combo-trigger { flex-shrink: 0; white-space: nowrap; font-size: 12px !important; }
  #ghn-tg-reload-btn, #ghn-tg-clear-selection-btn { padding: 4px 9px !important; }
  #qh-fs-btn { padding: 4px 9px; border-radius: 6px; border: 1px solid #ced4da; background: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
  #qh-fs-btn:hover { background: #f1f3f5; }
  #ghn-tg-map-status { padding: 2px 10px !important; font-size: 11px !important; }
  #ghn-tg-info-panel { width: 340px; padding: 10px 12px; top: 8px; right: 8px; font-size: 12px; max-height: calc(100% - 16px); }
  #ghn-tg-info-panel.ghn-tg-info-panel--wide { width: 430px; }
  #ghn-tg-info-panel.qh-min { max-height: 34px !important; overflow: hidden !important; }
  #qh-info-min { position: absolute; top: 6px; right: 28px; border: none; background: transparent; font-size: 15px; line-height: 1; cursor: pointer; color: #868e96; padding: 2px 4px; }
  #qh-info-min:hover { color: #212529; }
  table.qh-sum th, table.qh-sum td { padding: 3px 5px; }
</style>
</head>
<body>
<script src="quyhoach/qh_web.js?v=33"></script>
</body>
</html>
